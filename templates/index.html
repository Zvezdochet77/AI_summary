<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Summarizer — ИИ Конспекты</title>
    <!-- Tailwind CSS CDN для быстрого и красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Заголовок -->
        <header class="text-center">
            <h1 class="text-4xl font-bold text-indigo-400">🤖 AI Document Summarizer</h1>
            <p class="text-gray-400 mt-2">Асинхронный генератор конспектов на базе FastAPI, RabbitMQ и Ollama</p>
        </header>

        <!-- Форма отправки -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-white">Добавить документ</h2>
            <form id="docForm" class="space-y-4">
                
                <!-- Блок для ручного ввода текста -->
                <div class="space-y-4 p-4 bg-gray-750 border border-gray-700 rounded-lg">
                    <h3 class="text-md font-medium text-indigo-300 mb-2">Вариант 1: Ввести текст вручную</h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-300">Название</label>
                        <input type="text" id="title" placeholder="Например: Статья про RabbitMQ" 
                               class="w-full mt-1 p-3 bg-gray-700 rounded-lg text-white border border-gray-600 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300">Текст документа</label>
                        <textarea id="content" rows="4" placeholder="Вставьте сюда текст для конспекта..." 
                                  class="w-full mt-1 p-3 bg-gray-700 rounded-lg text-white border border-gray-600 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                </div>

                <div class="text-center text-gray-500 font-bold uppercase text-sm">или</div>

                <!-- Блок для загрузки файла -->
                <div class="space-y-2 p-4 bg-gray-750 border border-gray-700 rounded-lg">
                    <h3 class="text-md font-medium text-indigo-300 mb-2">Вариант 2: Загрузить текстовый файл</h3>
                    <label class="block text-sm font-medium text-gray-300">Файл (.txt)</label>
                    <input type="file" id="fileInput" accept=".txt" 
                           class="w-full mt-1 p-2 bg-gray-700 rounded-lg text-white border border-gray-600 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                </div>

                <button type="submit" 
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold transition text-white shadow-lg mt-4">
                    Отправить на суммаризацию 🚀
                </button>
            </form>
        </div>

        <!-- Список документов -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-white">Мои документы</h2>
                <button onclick="loadDocuments()" class="text-sm text-indigo-400 hover:underline">Обновить 🔄</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-gray-700 text-gray-200 uppercase text-xs">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Название</th>
                            <th class="p-3">Статус</th>
                            <th class="p-3">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="docsTable" class="divide-y divide-gray-700">
                        <!-- Строки подгружаются через JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Модалка / Блок просмотра конспекта -->
        <div id="resultModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-800 p-6 rounded-xl max-w-2xl w-full border border-gray-700 space-y-4">
                <h3 id="modalTitle" class="text-xl font-bold text-indigo-400"></h3>
                <div class="p-4 bg-gray-900 rounded-lg max-h-96 overflow-y-auto text-gray-200 whitespace-pre-wrap leading-relaxed border border-gray-700" id="modalSummary"></div>
                <button onclick="closeModal()" class="w-full py-3 bg-gray-700 hover:bg-gray-600 rounded-lg font-bold transition">Закрыть</button>
            </div>
        </div>

    </div>

    <!-- JS логика подключения к API -->
    <script>
        const API_URL = "";

        // Отправка формы
        document.getElementById('docForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            let res;

            try {
                // Если выбран файл, отправляем его через FormData
                if (fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append("file", fileInput.files[0]);

                    res = await fetch(`${API_URL}/documents/upload/`, {
                        method: 'POST',
                        body: formData
                    });
                } 
                // Иначе отправляем обычный текст
                else {
                    if (!title || !content) {
                        alert("Пожалуйста, заполните название и текст ИЛИ загрузите файл.");
                        return;
                    }
                    res = await fetch(`${API_URL}/documents/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, content })
                    });
                }

                if (res.ok) {
                    document.getElementById('docForm').reset();
                    loadDocuments();
                } else {
                    const errData = await res.json();
                    alert(`Ошибка при создании документа: ${JSON.stringify(errData)}`);
                }
            } catch (error) {
                alert(`Ошибка сети: ${error.message}`);
            }
        });

        // Загрузка списка документов
        async function loadDocuments() {
            try {
                const res = await fetch(`${API_URL}/documents/`);
                if (!res.ok) return;
                const docs = await res.json();
                
                const tbody = document.getElementById('docsTable');
                tbody.innerHTML = docs.map(doc => {
                    let statusBadge = '';
                    if (doc.status === 'pending') statusBadge = '<span class="bg-yellow-900/50 text-yellow-300 border border-yellow-700 px-2 py-1 rounded text-xs">⏳ В очереди</span>';
                    else if (doc.status === 'processing') statusBadge = '<span class="bg-blue-900/50 text-blue-300 border border-blue-700 px-2 py-1 rounded text-xs animate-pulse">⚙️ Обработка...</span>';
                    else if (doc.status === 'completed') statusBadge = '<span class="bg-green-900/50 text-green-300 border border-green-700 px-2 py-1 rounded text-xs">✅ Готово</span>';
                    else statusBadge = '<span class="bg-red-900/50 text-red-300 border border-red-700 px-2 py-1 rounded text-xs">❌ Ошибка</span>';

                    return `
                        <tr class="hover:bg-gray-750 transition-colors">
                            <td class="p-3 font-mono text-gray-400">${doc.id}</td>
                            <td class="p-3 font-medium text-white">${doc.title}</td>
                            <td class="p-3">${statusBadge}</td>
                            <td class="p-3">
                                ${doc.status === 'completed' 
                                    ? `<button onclick="showSummary('${escapeHtmlForAttr(doc.title)}', '${escapeHtmlForAttr(doc.summary)}')" class="text-indigo-400 hover:text-indigo-300 hover:underline font-medium transition-colors">Посмотреть</button>`
                                    : '<span class="text-gray-500 text-sm">Ожидайте...</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error("Ошибка при загрузке документов:", error);
            }
        }

        // Вспомогательная функция для безопасной передачи строк в HTML атрибуты
        function escapeHtmlForAttr(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/'/g, "&apos;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\n/g, "\\n")
                .replace(/\r/g, "\\r");
        }

        function showSummary(title, summary) {
            document.getElementById('modalTitle').innerText = title;
            // Восстанавливаем переносы строк для отображения
            document.getElementById('modalSummary').innerText = summary.replace(/\\n/g, '\n').replace(/\\r/g, '\r');
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        // Периодический авто-опрос статусов раз в 3 секунды (Polling)
        setInterval(loadDocuments, 3000);
        // Первая загрузка
        loadDocuments();
    </script>
</body>
</html>
